# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions: []
    # - name: actionlint
    #   affects_cache:
    #     - .github/linters/actionlint.yml
    #   commands:
    #     - name: lint
    #       run: actionlint -config-file ${workspace}/.github/linters/actionlint.yml -format "{{json .}}" ${target}
    # - name: shfmt
    #   commands:
    #     - name: format
    #       output: shfmt
    #       run: shfmt -w -s -i 2 ${target}
  ignore: []
    # - linters: [prettier]
    #   paths:
    #     - Tests/Resources/*.json
    # - linters: [yamllint]
    #   paths:
    #     - .github/workflows/*.yml
  enabled:
    - actionlint@1.7.12
    - checkov@3.3.29
    - dotenv-linter@4.0.0
    - git-diff-check
    - markdownlint@0.49.1
    - pinact@4.1.1
    - prettier@3.9.10
    - trufflehog@3.97.0
    - yamllint@1.38.0
    - zizmor@1.31.0
actions:
  definitions:
    - id: pre-commit
      display_name: pre-commit
      description: Run hooks from .pre-commit-config.yaml
      packages_file: ${workspace}/.trunk/pre-commit-requirements.txt
      runtime: python
      run: pre-commit run
      triggers:
        - git_hooks: [pre-commit]
  enabled:
    - pre-commit
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
