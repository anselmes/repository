# Add 'repo' label to any root file changes
repo:
  - changed-files:
      - any-glob-to-any-file: "*"

# Add 'ci' label to any changes in the '.github' directory
ci:
  - changed-files:
      - any-glob-to-any-file:
          # - .github/actions/*
          # - .github/actions/*/**
          - .github/auto_assign.yml
          - .github/auto_assign.yml/**
          - .github/dependabot.yml
          - .github/dependabot.yml/**
          - .github/workflows/*
          - .github/workflows/*/**
          - .trunk/*
          - .trunk/*/**

# Add 'container' label to any changes in 'compose.yml' or 'Dockerfile'
container:
  - changed-files:
      - any-glob-to-any-file:
          - "*/**/compose.yml"
          - "*/**/Dockerfile"
          - "*/compose.yml"
          - "*/Dockerfile"

